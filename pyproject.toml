[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "integration: marks tests that touch the database or filesystem (deselect with -m 'not integration')",
    "slow: marks slow tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/ingest/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
